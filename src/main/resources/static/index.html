<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件上传</title>
    <style>
        body {
            font-family: -apple-system, sans-serif;
            background-color: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .upload-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            width: 360px;
            text-align: center;
        }
        h2 { color: #333; margin-top: 0; }
        .file-box {
            border: 2px dashed #e0e6ed;
            padding: 25px 10px;
            border-radius: 8px;
            cursor: pointer;
            background: #fafbfc;
        }
        input[type="file"] { display: none; }
        .upload-btn {
            margin-top: 15px;
            background: #409eff;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
        .upload-btn:disabled { background: #a0cfff; }
        #status { margin-top: 15px; font-size: 14px; color: #666; word-break: break-all; }
    </style>
</head>
<body>

<div class="upload-card">
    <h2>文件上传</h2>

    <div class="file-box" onclick="document.getElementById('fileInput').click()">
        <span id="fileHint">点击选择文件</span>
        <input type="file" id="fileInput" onchange="updateFileInfo()">
    </div>

    <button class="upload-btn" id="uploadBtn" onclick="performUpload()">上传</button>

    <div id="status"></div>
</div>

<script>
    // 选择文件后更新文字
    function updateFileInfo() {
        const fileInput = document.getElementById('fileInput');
        const fileHint = document.getElementById('fileHint');
        if (fileInput.files.length > 0) {
            fileHint.innerText = "已选择: " + fileInput.files[0].name;
        }
    }

    // 异步上传
    async function performUpload() {
        const fileInput = document.getElementById('fileInput');
        const status = document.getElementById('status');
        const uploadBtn = document.getElementById('uploadBtn');

        if (fileInput.files.length === 0) {
            status.innerText = "❌ 请先选择文件";
            status.style.color = "#f56c6c";
            return;
        }

        const formData = new FormData();
        formData.append("file", fileInput.files[0]);

        status.innerText = "⏳ 正在上传...";
        status.style.color = "#666";
        uploadBtn.disabled = true;

        try {
            const response = await fetch('/upload', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            if (response.ok) {
                // 成功：直接把文字替换为可点击的直连 A 标签
                status.innerHTML = `🎉 上传成功！直连地址：<br><a href="${data.url}" target="_blank" style="color: #409eff; text-decoration: underline;">${data.url}</a>`;
            } else {
                // 后端返回的业务异常（如文件过大、非法字符等）
                status.innerText = "❌ 上传失败: " + (data.error || "服务器开小差了");
                status.style.color = "#f56c6c";
            }
        } catch (error) {
            // 网络层面的异常（如服务器没开、断网等）
            status.innerText = "❌ 网络错误，无法连接到服务器";
            status.style.color = "#f56c6c";
        } finally {
            uploadBtn.disabled = false;
        }
    }
</script>

</body>
</html>
